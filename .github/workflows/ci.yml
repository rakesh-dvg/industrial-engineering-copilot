name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: iec
          POSTGRES_PASSWORD: iec
          POSTGRES_DB: iec
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iec -d iec"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Lint backend
        run: ruff check .

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://iec:iec@localhost:5432/iec
          DATABASE_URL_SYNC: postgresql+psycopg://iec:iec@localhost:5432/iec
        run: alembic upgrade head

      - name: Run backend tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://iec:iec@localhost:5432/iec
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  openapi:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Verify OpenAPI contract paths exist
        run: python .github/scripts/check_openapi_paths.py
