# Production-like local stack (Nginx frontend + FastAPI backend).
# AWS MVP uses RDS, S3, and ECS instead of the local postgres/minio services below.
# See docs/aws-mvp-deployment.md for AWS deployment.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: iec
      POSTGRES_PASSWORD: iec
      POSTGRES_DB: iec
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iec -d iec"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
      args:
        RELEASE: RELEASE.2025-09-07T16-13-09Z
    image: iec-minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://iec:iec@postgres:5432/iec
      DATABASE_URL_SYNC: postgresql+psycopg://iec:iec@postgres:5432/iec
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      ENVIRONMENT: production
      DEBUG: "false"
      CORS_ORIGINS: '["http://localhost:8080"]'
    ports:
      - "8020:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # Local prod-like compose uses separate ports; AWS build uses empty string.
        VITE_API_BASE_URL: http://localhost:8020
    ports:
      - "8080:80"
    depends_on:
      - backend
