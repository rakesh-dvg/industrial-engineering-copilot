services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: iec-postgres
    environment:
      POSTGRES_USER: iec
      POSTGRES_PASSWORD: iec
      POSTGRES_DB: iec
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iec -d iec"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: iec-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
      args:
        RELEASE: RELEASE.2025-09-07T16-13-09Z
    image: iec-minio:RELEASE.2025-09-07T16-13-09Z
    container_name: iec-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: iec-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://iec:iec@postgres:5432/iec
      DATABASE_URL_SYNC: postgresql+psycopg://iec:iec@postgres:5432/iec
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      CORS_ORIGINS: '["http://localhost:5174","http://127.0.0.1:5174"]'
      GROQ_MODEL: openai/gpt-oss-120b
      GROQ_BASE_URL: https://api.groq.com/openai/v1
    ports:
      - "8020:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: iec-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8020
    ports:
      - "5174:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data:
  minio_data:
